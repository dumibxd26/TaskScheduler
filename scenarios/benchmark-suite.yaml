schema_version: 1
suite:
  id: generic-v1
  description: >-
    Factorial train, validation, and holdout corpus for long-running CPU,
    memory, I/O, and mixed workflows with and without dependencies.
  base_data_mib: 1024
  topologies: [independent, linear, fanout, fanin, forkjoin]
  archetypes:
    cpu:
      class: CPU_BOUND
      image: benchmark-cpu:v1
      image_size_mib: 300
      startup_s: 2
      supported_architectures: [amd64, arm64]
      cpu_cores: 1
      memory_mib: 1024
      working_set_mib: 256
      compute_gflop: 18000
      memory_read_mib: 120000
      memory_write_mib: 30000
      parallel_fraction: 0.92
      cache_reuse_fraction: 0.80
    memory:
      class: MEMORY_BOUND
      image: benchmark-memory:v1
      image_size_mib: 220
      startup_s: 2
      supported_architectures: [amd64, arm64]
      cpu_cores: 1
      memory_mib: 2048
      working_set_mib: 1536
      compute_gflop: 600
      memory_read_mib: 30000000
      memory_write_mib: 10000000
      parallel_fraction: 0.45
      cache_reuse_fraction: 0.05
    io:
      class: IO_BOUND
      image: benchmark-io:v1
      image_size_mib: 180
      startup_s: 2
      supported_architectures: [amd64, arm64]
      cpu_cores: 1
      memory_mib: 1024
      working_set_mib: 512
      compute_gflop: 300
      memory_read_mib: 200000
      memory_write_mib: 100000
      disk_read_mib: 1800000
      disk_write_mib: 900000
      random_io_fraction: 0.20
      io_block_kib: 64
      parallel_fraction: 0.20
      cache_reuse_fraction: 0.10
  resource_patterns:
    cpu: [cpu]
    memory: [memory]
    io: [io]
    mixed: [io, memory, cpu]
  splits:
    train:
      task_counts: [4, 8]
      work_scales: [0.5, 2.0]
      data_scales: [1.0]
    validation:
      task_counts: [6]
      work_scales: [1.0]
      data_scales: [0.25, 4.0]
    holdout:
      task_counts: [10]
      work_scales: [0.25, 4.0]
      data_scales: [2.0]